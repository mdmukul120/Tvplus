name: Auto Scrape M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক চলবে
  workflow_dispatch:      # ম্যানুয়ালি রান করার জন্য button দিবে

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cloudscraper

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated Playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Auto-update playlist [skip ci]" || exit 0
        git push
